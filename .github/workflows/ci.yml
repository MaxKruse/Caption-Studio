name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven/bun@v2
        with:
          version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Unit + route integration tests. No live llama.cpp server needed.
      # The Playwright e2e suite (test:e2e) is not run in CI: it needs a
      # browser plus a running app and llama.cpp server - run it locally.
      - name: Test
        run: bun test
