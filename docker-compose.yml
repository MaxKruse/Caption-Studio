services:
  caption-studio:
    build: .
    ports:
      - "8800:3000"
    environment:
      - NODE_ENV=production
      - DEFAULT_SERVER_URL=http://host.docker.internal:8080
      - TAG_SERVICE_URL=http://tag-service:8801
    restart: unless-stopped

  tag-service:
    build:
      context: ./tag-service
    restart: unless-stopped
    volumes:
      - C:/Users/maxkr/.cache/huggingface:/root/.cache/huggingface:ro
